services:
  - type: web
    name: tripwire-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_ORIGIN_REGEX
        value: ""
      - key: MODEL_PATH
        value: /opt/render/project/src/backend/models
      - key: DATA_PATH
        value: /opt/render/project/src/backend/data
      - key: LOG_LEVEL
        value: INFO
